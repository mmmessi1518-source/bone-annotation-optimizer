name: Build Windows packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Build portable archive and selectable-directory installer
        shell: pwsh
        run: ./scripts/build.ps1 -Python python -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: BoneAnnotationOptimizer-windows-x64
          path: releases/*/*
          if-no-files-found: error
